name: Verify agent skill dependencies
on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - "scripts/check_skill_dependencies.py"
      - ".github/workflows/skills-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skill-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_skill_dependencies.py
